# ADTY AI 的 Nginx 站点配置（任务 10.1，设计稿 §10.1），部署步骤见 docs/adty/deploy.md。
# 放到 /etc/nginx/conf.d/adtyai.conf；Debian 的 nginx.conf 在 http 块里 include conf.d/*.conf，所以下面的指令都在 http 块里。
# 前面是 Cloudflare 小云朵：只有 Cloudflare 的地址能连 443（ufw-cloudflare.sh），真实 IP 取 CF-Connecting-IP。

# Cloudflare 的网段（set_real_ip_from 列表），由 update-cloudflare-ips.sh 生成并每周更新，不手工改。
include /etc/nginx/cloudflare-ips.conf;
real_ip_header CF-Connecting-IP;

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

map $uri $adty_referrer_policy {
    default      strict-origin-when-cross-origin;
    /user/reset  no-referrer;
    /user/reset/ no-referrer;
}

# Old reset emails can still carry credentials in a query. Keep request
# metadata for auditing without writing that query or a stale page referrer.
map $uri $adty_log_request {
    default      $request;
    /user/reset  "$request_method $uri $server_protocol";
    /user/reset/ "$request_method $uri $server_protocol";
}
map $http_referer $adty_log_referrer {
    default $http_referer;
    ~^https?://[^/]+/user/reset(?:[/?]|$) "[redacted reset link]";
}
log_format adty_safe '$remote_addr - $remote_user [$time_local] '
                     '"$adty_log_request" $status $body_bytes_sent '
                     '"$adty_log_referrer" "$http_user_agent"';

# 不认识的域名直接断开，不出示证书，别人用 IP 扫 443 看不到站点证书。
server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    ssl_reject_handshake on;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    # Replace with the real hostnames before enabling this site. Do not leave a production domain here.
    server_name example.invalid;
    access_log /var/log/nginx/access.log adty_safe;

    # Cloudflare 源服务器证书（SSL/TLS 选「完全（严格）」），证书不进仓库。
    ssl_certificate     /etc/ssl/cloudflare-origin.pem;
    ssl_certificate_key /etc/ssl/cloudflare-origin.key;
    ssl_protocols       TLSv1.2 TLSv1.3;

    # 默认 1m，长上下文和图片请求会被拒（413）。Cloudflare 免费版和专业版单个请求上限 100 MB。
    client_max_body_size 100m;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy $adty_referrer_policy always;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header Content-Security-Policy "frame-ancestors 'none'" always;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # $remote_addr 已经被 real_ip 换成访客的真实 IP
        proxy_set_header X-Real-IP $remote_addr;
        # 覆盖而不是追加，客户端伪造的 X-Forwarded-For 传不进去
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        # 访客所在国家（Cloudflare 填，Nginx 默认也会透传，写明是因为 12.1 依赖它）
        proxy_set_header CF-IPCountry $http_cf_ipcountry;
        # WebSocket
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        # 流式输出不攒包
        proxy_buffering off;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }
}

# 站长分站（任务 11.11）：平台子域名 *.<分站根域名> 和站长的自定义域名。
# Host 必须原样传给网关，11.2 靠它识别站点；分站根域名和自定义域名都在网关的站点表里，Nginx 不列具体域名。
# server_name 用正则 ~. 接收所有其他 Host（nginx 里 _ 只是个匹配不到的名字，单写 _ 收不到请求）。
# 代价：带任意 SNI 的握手都会拿到下面这张证书，不再被上面的 ssl_reject_handshake 拒掉；不带 SNI（直接用 IP）的照样拒。
# 443 只对 Cloudflare 网段开放（ufw-cloudflare.sh），别人扫不到这台机器，所以可以接受。
# 自定义域名的流量回源时 SNI 是回源主机名（Cloudflare for SaaS 的 fallback origin），Host 是客户的域名：
# 证书按 SNI 选，所以 *.<分站根域名> 那张 Origin CA 证书就能用，不用给每个站长的域名单独发证书。
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name ~.;
    access_log /var/log/nginx/access.log adty_safe;

    # Cloudflare 源服务器证书，主机名填 <分站根域名> 和 *.<分站根域名>（回源主机名在它下面）。
    ssl_certificate     /etc/ssl/cloudflare-origin-sites.pem;
    ssl_certificate_key /etc/ssl/cloudflare-origin-sites.key;
    ssl_protocols       TLSv1.2 TLSv1.3;

    client_max_body_size 100m;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy $adty_referrer_policy always;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header Content-Security-Policy "frame-ancestors 'none'" always;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        # 访客所在国家（Cloudflare 填），营销同意的默认值按它判断（任务 12.1）
        proxy_set_header CF-IPCountry $http_cf_ipcountry;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_buffering off;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }
}
