# adtyai-api：每次 push 跑测试并构建镜像，main、merge/* 分支和 v* 标签推送到 GHCR（实施方案任务 0.4、1.7）。
# PR 的测试由上游 ci.yml 负责，这里只构建镜像；手动运行也只构建。
name: ADTY test and GHCR image

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# merge/* 分支和 PR 按 ref 分组，只留最新的一次运行。main 和标签按提交分组，每次运行都跑完：
# 同一组里排队的运行会被后来的顶掉（cancel-in-progress 关掉也一样），按 ref 分组的话连推几次 main，
# 中间的提交就没有 sha-<7 位> 镜像，生产回滚换回上一个 sha 标签时拉不到
concurrency:
  group: ${{ github.workflow }}-${{ (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')) && github.sha || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' && !startsWith(github.ref, 'refs/tags/') }}

jobs:
  # 后端、前端拆成两个作业并行跑，互相没有 needs；镜像要等两个都绿才构建
  test-backend:
    name: Backend vet, build, and test
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    # 上游 ci.yml 的后端 15 分钟；这里还多跑了 govulncheck 和闭环检查
    timeout-minutes: 25
    env:
      GOWORK: 'off'
      # 一次性测试库密码，只给 CI 用，不是生产密码。
      ADTY_TEST_PG_DSN: 'host=127.0.0.1 port=5432 user=postgres password=adty_ci_test dbname=adty_test sslmode=disable'
      TEST_POSTGRES_DSN: 'host=127.0.0.1 port=5432 user=postgres password=adty_ci_test dbname=adty_test sslmode=disable'
      AUDIT_POSTGRES_DSN: 'host=127.0.0.1 port=5432 user=postgres password=adty_ci_test dbname=adty_test sslmode=disable'
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: adty_ci_test
          POSTGRES_DB: adty_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d adty_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      # 同 ci.yml，去掉了 repository（push 事件里它是空的）
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.sha }}

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            relaykit/go.sum
            tokenkit/go.sum

      - name: Create frontend embed placeholder
        run: |
          mkdir -p web/dist
          touch web/dist/index.html

      - name: Vet root module
        run: go vet ./...

      - name: Vet relaykit independently
        working-directory: relaykit
        run: go vet ./...

      - name: Vet tokenkit independently
        working-directory: tokenkit
        run: go vet ./...

      - name: Build root module
        run: go build ./...

      - name: Build relaykit independently
        working-directory: relaykit
        run: go build ./...

      - name: Build tokenkit independently
        working-directory: tokenkit
        run: go build ./...

      - name: Test root, relaykit, and tokenkit modules
        run: make test

      - name: Test main package deployment constraints
        run: go test -count=1 -run 'TestPprofListenAddrIsLoopback|TestRootComposeDoesNotPublishExampleSecrets|TestRunnableEntrypointsDoNotUseFloatingUpstreamImages' .

      - name: Scan Go modules for known vulnerabilities
        run: |
          go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...
          (cd relaykit && go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...)
          (cd tokenkit && go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...)

      - name: Run closed-loop checks
        run: bash scripts/adty/e2e-closed-loop.sh

  # 前端同 ci.yml，另加 lint 和 copyright:check 的基线比较（和 scripts/adty/check.sh 一样，
  # 见 docs/adty/baseline.md）。ratchet.mjs 和 copyright:check 用 node 跑，版本同 web/.node-version
  # make check-plugins 只是 bun run lint:plugins + format:plugins:check，依赖这里已经装好的依赖，
  # 单独开作业还要重新 checkout + install，反而更慢，所以留在本作业里。
  test-frontend:
    name: Frontend build, lint, and test
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    # 上游 ci.yml 的前端 10 分钟；这里还多跑了 lint、build、test 和 i18n/copyright 检查
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.sha }}

      - name: Set up Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: web/.node-version

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: '1.4.4'

      - name: Install frontend dependencies
        working-directory: web
        run: bun install --frozen-lockfile

      - name: Check plugins
        working-directory: .
        run: make check-plugins

      - name: Typecheck frontend
        working-directory: web
        run: bun check -b

      - name: Build production bundle
        working-directory: web
        run: bun run build

      - name: Lint frontend against baseline
        run: node scripts/adty/ratchet.mjs lint

      - name: Test frontend
        working-directory: web
        run: bun run test

      # 任务 9.2：我们加的前端语言键 8 种语言都要有、而且不等于英文
      - name: Check our frontend translations
        working-directory: web
        run: node scripts/adty/i18n-check.mjs

      - name: Check copyright headers against baseline
        run: node scripts/adty/ratchet.mjs copyright

  # 两个架构各用一个原生 runner 并行构建（arm64 用 GitHub 免费的 ubuntu-24.04-arm，不用 QEMU），
  # 每边按 digest 推单架构镜像，再由 merge 合成 manifest list。
  image:
    name: Build ${{ matrix.arch }} image
    needs: [test-backend, test-frontend]
    # 只写 needs 的话测试被跳过时 image 也会被跳过；PR 和手动运行没有测试，也要构建
    if: ${{ !cancelled() && ((needs.test-backend.result == 'success' && needs.test-frontend.result == 'success') || (github.event_name != 'push' && needs.test-backend.result == 'skipped' && needs.test-frontend.result == 'skipped')) }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
            platform: linux/amd64
          - arch: arm64
            runner: ubuntu-24.04-arm
            platform: linux/arm64
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    env:
      # 只有 push 事件、并且是 main、merge/* 分支或 v* 标签时才登录 ghcr.io 并推送，其他情况只构建。
      # merge/* 的镜像给测试环境做合并上游后的客户端回归（docs/adty/upstream-merge.md 第 7 步）
      PUSH_IMAGE: ${{ github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/merge/') || startsWith(github.ref, 'refs/tags/v')) }}

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      # Dockerfile 把 VERSION 交给前端构建，并写进二进制的 common.Version
      - name: Write VERSION
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          short_sha=${GITHUB_SHA::7}
          if [ "$GITHUB_EVENT_NAME" = pull_request ]; then
            version="pr-${PR_NUMBER}-${short_sha}"
          elif [ "$GITHUB_REF_TYPE" = tag ]; then
            version=$GITHUB_REF_NAME
          elif [ "$GITHUB_REF_NAME" = main ]; then
            version="main-${short_sha}"
          else
            version="${GITHUB_REF_NAME}-${short_sha}"
          fi
          printf '%s\n' "$version" > VERSION
          echo "VERSION: $version"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Log in to GHCR
        if: env.PUSH_IMAGE == 'true'
        uses: docker/login-action@c99871dec2022cc055c062a10cc1a1310835ceb4 # v4.3.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # tags 由 merge 统一生成；这里只要 labels（OCI 标签写在各架构镜像自己的 config 里）
      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository }}
          flavor: latest=false
          # sha 标签只给 main，避免标签构建覆盖同名 sha 镜像。
          # merge/* 分支只打 merge-<名字>：分支名里的 / 会被换成 -，所以不用另加前缀
          tags: |
            type=sha,prefix=sha-,format=short,enable=${{ github.ref == 'refs/heads/main' }}
            type=ref,event=branch,enable=${{ startsWith(github.ref, 'refs/heads/merge/') }}
            type=ref,event=tag
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}

      # 必须写 context: .：默认的 Git 上下文会忽略上面写入的 VERSION，镜像里的版本号会是空的。
      # 单架构按 digest 推送，不进 ::tag，manifest list 交给 merge 作业合成。
      - name: Build image
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          platforms: ${{ matrix.platform }}
          # 推送时按 digest 推单架构镜像（digest 交给 merge）；PR 和手动运行只验证构建，不带 exporter
          outputs: ${{ env.PUSH_IMAGE == 'true' && format('type=image,name=ghcr.io/{0},push-by-digest=true,name-canonical=true,push=true', github.repository) || '' }}
          labels: ${{ steps.meta.outputs.labels }}
          # 两个架构的缓存要分开 scope，否则会互相覆盖
          cache-from: type=gha,scope=${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.arch }}

      - name: Export digest
        id: digest
        if: env.PUSH_IMAGE == 'true'
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"
          echo "digest=$digest" >> "$GITHUB_OUTPUT"

      # 矩阵实例之间共享不了 outputs，digest 用 artifact 传给 merge
      - name: Upload digest
        if: env.PUSH_IMAGE == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: digest-${{ matrix.arch }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  # 把两个架构的 digest 合成一个 manifest list，套上原来的 tags。不推送时（PR、手动运行）只跳过打标签。
  merge:
    name: Merge multi-arch manifest
    needs: image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      # manifest list 的 digest，promote-main 用它把 :main 指过来
      digest: ${{ steps.digest.outputs.digest }}
    env:
      PUSH_IMAGE: ${{ github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/merge/') || startsWith(github.ref, 'refs/tags/v')) }}

    steps:
      - name: Set up Docker Buildx
        if: env.PUSH_IMAGE == 'true'
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Log in to GHCR
        if: env.PUSH_IMAGE == 'true'
        uses: docker/login-action@c99871dec2022cc055c062a10cc1a1310835ceb4 # v4.3.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Download digests
        if: env.PUSH_IMAGE == 'true'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: /tmp/digests
          pattern: digest-*
          merge-multiple: true

      - name: Extract metadata
        id: meta
        if: env.PUSH_IMAGE == 'true'
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository }}
          flavor: latest=false
          # sha 标签只给 main，避免标签构建覆盖同名 sha 镜像。
          # merge/* 分支只打 merge-<名字>：分支名里的 / 会被换成 -，所以不用另加前缀
          tags: |
            type=sha,prefix=sha-,format=short,enable=${{ github.ref == 'refs/heads/main' }}
            type=ref,event=branch,enable=${{ startsWith(github.ref, 'refs/heads/merge/') }}
            type=ref,event=tag
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}

      - name: Create manifest list
        if: env.PUSH_IMAGE == 'true'
        working-directory: /tmp/digests
        run: |
          docker buildx imagetools create $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf 'ghcr.io/${{ github.repository }}@sha256:%s ' *)

      - name: Read manifest digest
        id: digest
        if: env.PUSH_IMAGE == 'true'
        run: |
          tag=$(jq -cr '.tags[0]' <<< "$DOCKER_METADATA_OUTPUT_JSON")
          digest=$(docker buildx imagetools inspect "$tag" --format '{{json .Manifest}}' | jq -r '.digest')
          echo "digest=$digest" >> "$GITHUB_OUTPUT"

  promote-main:
    name: Promote the current main image
    # 测试全绿才把 :main 指向新 digest；镜像本身只打 sha-<7 位>/分支/标签，不碰 :main
    needs: [merge, test-backend, test-frontend]
    if: ${{ !cancelled() && github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.test-backend.result == 'success' && needs.test-frontend.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    concurrency:
      group: adty-ghcr-promote-main-${{ github.repository }}
      cancel-in-progress: false
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.sha }}
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
      - name: Log in to GHCR
        uses: docker/login-action@c99871dec2022cc055c062a10cc1a1310835ceb4 # v4.3.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Promote immutable digest after checking main
        env:
          GH_TOKEN: ${{ github.token }}
          IMAGE_DIGEST: ${{ needs.merge.outputs.digest }}
        run: bash scripts/adty/promote-main-image.sh "$IMAGE_DIGEST"
