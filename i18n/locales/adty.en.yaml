adty.site.migration_mail_subject: "{{.SystemName}} is closing; sign in on the main site"
adty.site.migration_mail_body: "{{.SystemName}} will close on {{.When}}. Accounts on this site are inherited by the main site only; they are not transferred to another site. Sign in at {{.Link}} with this account's unique username {{.Username}} and complete any required verification: choose this account by that username, then verify the password. This account's orders and balance stay with this account and are not merged into any other account that shares the same email. API keys from the closing site are revoked at migration and historical records are kept; create new keys on the main site. For support, contact: {{.SupportContact}}"
