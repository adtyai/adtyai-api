# Frontend Development - Backend built from local source
#
# Usage:
#   1. docker compose -f docker-compose.dev.yml up -d
#   2. make dev-web
#   3. Open http://localhost:5173 (Rsbuild dev server, API auto-proxied to :3000)
#
# Rebuild backend after Go code changes:
#   docker compose -f docker-compose.dev.yml up -d --build adtyai-api-app
#
# Stop:
#   docker compose -f docker-compose.dev.yml down
#
# Reset data:
#   docker compose -f docker-compose.dev.yml down -v
#
# Service names match the production compose so SQL_DSN and Redis hosts stay the same.
# Container names use a -dev suffix so they do not collide with adtyai-api-app,
# adtyai-api-postgres, and adtyai-api-redis on the same Docker host.
# The database name is adty-ai.

services:
  adtyai-api-app:
    build:
      context: .
      dockerfile: Dockerfile.dev
    image: adtyai-api-dev:local
    container_name: adtyai-api-app-dev
    restart: unless-stopped
    ports:
      - "3000:3000"
    volumes:
      - dev_data:/data
    environment:
      - SQL_DSN=postgresql://root:123456@adtyai-api-postgres:5432/adty-ai
      - REDIS_CONN_STRING=redis://adtyai-api-redis
      - TZ=Asia/Shanghai
      - BATCH_UPDATE_ENABLED=true
      # Local HTTP dev mode: keep Secure=false and leave TRUSTED_URL unset. This disables the refresh/logout OriginGuard so the :5173 -> :3000 dev proxy works.
      - SESSION_COOKIE_SECURE=false
      # For HTTPS only: set Secure=true and list every exact trusted HTTPS browser Origin. This does not configure relay CORS.
      # - SESSION_COOKIE_SECURE=true
      # - SESSION_COOKIE_TRUSTED_URL=https://example.com,https://admin.example.com
    depends_on:
      adtyai-api-redis:
        condition: service_started
      adtyai-api-postgres:
        condition: service_healthy
    networks:
      - dev-network

  adtyai-api-redis:
    image: redis:7-alpine
    container_name: adtyai-api-redis-dev
    restart: unless-stopped
    networks:
      - dev-network

  adtyai-api-postgres:
    image: postgres:15-alpine
    container_name: adtyai-api-postgres-dev
    restart: unless-stopped
    environment:
      POSTGRES_USER: root
      POSTGRES_PASSWORD: 123456
      POSTGRES_DB: adty-ai
    volumes:
      - dev_pg_data:/var/lib/postgresql/data
    networks:
      - dev-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U root -d adty-ai"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  dev_data:
  dev_pg_data:

networks:
  dev-network:
    driver: bridge
